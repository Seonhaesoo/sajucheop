name: threads-check

# 쓰레드 토큰이 실제로 동작하는지 읽기 전용으로 확인 + 최근 게시물 5개 목록 (게시 없음)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_EN_USER_ID: ${{ secrets.THREADS_EN_USER_ID }}
      THREADS_EN_ACCESS_TOKEN: ${{ secrets.THREADS_EN_ACCESS_TOKEN }}
    steps:
      - name: /me 조회 + 최근 게시물
        run: |
          check() {
            LABEL=$1; UID_=$2; TOKEN=$3
            if [ -z "$TOKEN" ]; then echo "[$LABEL] 토큰 없음 — 건너뜀"; return 0; fi
            RES=$(curl -s "https://graph.threads.net/v1.0/me?fields=id,username&access_token=${TOKEN}")
            ID=$(echo "$RES" | sed -n 's/.*"id":"\([0-9]*\)".*/\1/p')
            if [ -z "$ID" ]; then echo "[$LABEL] 토큰 무효: $RES"; return 1; fi
            echo "[$LABEL] 계정 OK — $(echo "$RES" | sed -n 's/.*"username":"\([^"]*\)".*/\1/p') (ID 일치: $([ "$ID" = "$UID_" ] && echo yes || echo NO))"
            curl -s "https://graph.threads.net/v1.0/me/threads?fields=timestamp,text,permalink&limit=5&access_token=${TOKEN}" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); [print('[$LABEL]', p.get('timestamp','')[:16], '|', (p.get('text') or '').replace('\n',' / ')[:90], '|', p.get('permalink','')) for p in d.get('data',[])] or print('[$LABEL] 게시물 없음')"
          }
          check KO "$THREADS_USER_ID" "$THREADS_ACCESS_TOKEN"
          check EN "$THREADS_EN_USER_ID" "$THREADS_EN_ACCESS_TOKEN"
