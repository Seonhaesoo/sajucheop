name: engage-post

# 참여형 궁합 링크글 — 화·목·토 07:00 KST, 쓰레드 텍스트 게시 (캐러셀 봇의 빈 날을 채움)
on:
  schedule:
    - cron: '0 22 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 글 생성 + 쓰레드 게시
        run: node tools/engage-post.mjs

      - name: 커밋 (운영 페이지용 engage.txt)
        run: |
          git config user.name 'sajucheop-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add docs/social/engage.txt docs/social/engage.json
          git commit -m "참여형 궁합 글 $(TZ=Asia/Seoul date +%F)" || echo '변경 없음'
          git pull --rebase
          git push
