name: engage-post

# 참여형 궁합 링크글 — 화·목·토 07:00 KST, 쓰레드 텍스트 게시 (캐러셀 봇의 빈 날을 채움)
on:
  schedule:
    - cron: '0 22 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 봇 푸시 뒤 배포 워크플로를 직접 부르기 위해(workflow_dispatch)

concurrency:
  group: social-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_EN_USER_ID: ${{ secrets.THREADS_EN_USER_ID }}
      THREADS_EN_ACCESS_TOKEN: ${{ secrets.THREADS_EN_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 글 생성 + 쓰레드 게시
        run: node tools/engage-post.mjs

      - name: 커밋 (운영 페이지용 engage.txt) — 게시가 실패해도 글은 남긴다
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'sajucheop-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add docs/social/engage.txt docs/social/engage-en.txt docs/social/engage.json
          git commit -m "참여형 궁합 글 $(TZ=Asia/Seoul date +%F)" || echo '변경 없음'
          git pull --rebase
          git push

      # 봇 푸시(GITHUB_TOKEN)는 deploy-pages 를 깨우지 않는다 — 운영 페이지가 최신이 되게 직접 부른다(실패해도 무관)
      - name: Pages 배포 요청
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
