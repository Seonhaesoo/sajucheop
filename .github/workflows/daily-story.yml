name: daily-story

on:
  schedule:
    - cron: '10 15 * * *' # 매일 00:10 KST
  workflow_dispatch:
    inputs:
      force:
        description: '키 없이도 생성 테스트 (true/false)'
        default: 'false'

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 키 확인 — 없으면 이번 회차 전체 건너뜀
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ -n "$IG_ACCESS_TOKEN" ] || [ -n "$THREADS_ACCESS_TOKEN" ] || [ "$FORCE" = "true" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
            echo "API 키가 아직 없어 생성·게시를 건너뜁니다. 키 등록 후 다음 자정 실행부터 자동 재개됩니다."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 20

      - name: Playwright 설치
        if: steps.gate.outputs.go == '1'
        run: |
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright > /dev/null
          npx playwright install --with-deps chromium

      - name: 오늘 카드 생성
        if: steps.gate.outputs.go == '1'
        run: node tools/daily-story.mjs

      - name: 커밋 및 배포
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name 'sajucheop-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add docs/daily/
          git commit -m "데일리 일진 카드 $(TZ=Asia/Seoul date +%F)" || echo '변경 없음'
          git pull --rebase
          git push

      - name: Pages 배포 대기
        if: steps.gate.outputs.go == '1'
        run: |
          for i in $(seq 1 20); do
            sleep 15
            if curl -s https://sajucheop.com/daily/story.jpg | cmp -s - docs/daily/story.jpg; then
              echo '배포 확인 완료'
              exit 0
            fi
            echo "대기 중... ($i/20)"
          done
          echo '배포 확인 실패 — 게시는 이전 이미지로 진행될 수 있음'

      - name: 인스타 스토리 게시
        if: steps.gate.outputs.go == '1' && env.IG_ACCESS_TOKEN != ''
        env:
          IMAGE_URL: https://sajucheop.com/daily/story.jpg?v=${{ github.run_id }}
        run: node tools/ig-publish.mjs

      - name: 쓰레드 일진 글 게시
        if: steps.gate.outputs.go == '1' && env.THREADS_ACCESS_TOKEN != ''
        run: node tools/threads-publish.mjs
