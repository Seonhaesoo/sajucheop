name: sister-post

# 첩 시리즈 쓰레드 글 — 이틀에 한 편(저녁 19~21시 KST), 타로첩 → 꿈첩 → 생일첩 순서 (tools/sister-post.mjs) + 절기 날엔 이달의 띠별 운세(tools/wolun-post.mjs)
# 예약은 매일 돌고 쉬는 날인지는 스크립트가 날짜로 정한다(크론 격일은 월말에 연달아 걸림). 상태 파일·커밋 없음.
# 이 저장소의 예약 실행은 늘 2~4시간 반 밀린다(첫 예약 2026-09-19: 19:37 예약 → 22:58 실행, 일진 봇 00:10 → 03:20~04:50).
# 그래서 예약은 16:17 KST(07:17 UTC)에 걸어 실제 게시가 19~21시에 나가게 한다. 수동 실행에서 kind 를 고르면 쉬는 날이어도 만든다.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: '종류 지정 (tarot / dream / birthday, 비우면 날짜대로)'
        default: ''
      dry:
        description: '게시하지 않고 글만 출력 (true/false)'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: social-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 밀린 실행이 자정을 넘기면 스크립트가 다음 날로 읽어 쉬는 날·절기 아님으로 건너뛴다 → 예약 실행은 '6시간 전의 한국 날짜'(= 예약한 날)로 고정
      # 한국 시각 − 6시간 = UTC + 3시간 (시간대 자료 없이 계산)
      - name: 예약 실행의 글 날짜 고정
        if: github.event_name == 'schedule'
        run: echo "DATE=$(date -u -d '3 hours' +%F)" >> "$GITHUB_ENV"

      - name: 글 만들기 + 쓰레드 게시
        env:
          KIND: ${{ github.event.inputs.kind }}
          DRY: ${{ github.event.inputs.dry }}
        run: node tools/sister-post.mjs

      - name: 절기 날이면 이달의 띠별 운세 글 (공유 카드 첨부, tools/wolun-post.mjs)
        env:
          DRY: ${{ github.event.inputs.dry }}
        run: node tools/wolun-post.mjs
