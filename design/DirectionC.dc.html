<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
  <style>
    body { margin: 0; background: #FFF6EC; }
    a { color: #E8704F; text-decoration: none; }
    a:hover { color: #C9532F; }
  </style>
</helmet>
<div style="width: 390px; height: 720px; background: #FFF6EC; color: #3A2E24; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; box-sizing: border-box; display: flex; flex-direction: column; padding: 22px 22px 26px 22px;">

  <div style="display: flex; align-items: center; gap: 9px;">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="15" r="7" fill="#F2B33D"></circle>
      <path d="M15 2.5v3.4M15 24.1v3.4M2.5 15h3.4M24.1 15h3.4M6.2 6.2l2.4 2.4M21.4 21.4l2.4 2.4M23.8 6.2l-2.4 2.4M8.6 21.4l-2.4 2.4" stroke="#E8704F" stroke-width="2" stroke-linecap="round"></path>
    </svg>
    <div style="font-size: 16px; font-weight: 700;">해와 달</div>
  </div>

  <div style="margin-top: 26px;">
    <div style="font-size: 27px; font-weight: 700; line-height: 1.4;">오늘, 내 사주<br>가볍게 볼까?</div>
    <div style="margin-top: 10px; font-size: 14px; color: #8A7A6B;">생일만 넣으면 3초 만에 내 팔자 요약 완성</div>
  </div>

  <div style="margin-top: 22px; background: #FFFFFF; border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 22px rgba(120, 90, 60, 0.10);">
    <div style="display: flex; background: #F6EDE2; border-radius: 999px; padding: 4px;">
      <div style="flex: 1; height: 40px; background: #E8704F; color: #FFFFFF; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;">여자</div>
      <div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8A7A6B;">남자</div>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1.4; height: 48px; background: #FAF4EC; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">1993. 3. 26</div>
      <div style="flex: 1; height: 48px; background: #FAF4EC; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">11:40</div>
    </div>
    <div style="height: 56px; background: #E8704F; color: #FFFFFF; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">사주 보러 가기</div>
  </div>

  <div style="margin-top: 24px; font-size: 13px; font-weight: 700; color: #8A7A6B;">이런 것도 볼 수 있어요</div>
  <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
    <div style="background: #FDE8DC; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 500;">오늘의 운세</div>
    <div style="background: #E8F1E4; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 500;">커플 궁합</div>
    <div style="background: #FDF3D7; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 500;">신년운세</div>
    <div style="background: #EBEDF8; border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 500;">택일 캘린더</div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px;">
    <svg width="54" height="34" viewBox="0 0 54 34" fill="none">
      <ellipse cx="20" cy="22" rx="14" ry="9" fill="#F5E7D8"></ellipse>
      <ellipse cx="36" cy="24" rx="11" ry="7" fill="#F5E7D8"></ellipse>
      <circle cx="40" cy="11" r="7" fill="#F2B33D"></circle>
    </svg>
    <div style="font-size: 12px; color: #B5A28F;">매일 아침, 오늘의 한 줄 운세가 도착해요</div>
  </div>

</div>
</x-dc>
</body>
</html>
