<script src="../js/vendor-korean-lunar.js"></script>

<script src="../js/tojeong.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var M = window.Manseryeok, TJ = window.Tojeong;

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }
  function track(name, params) {
    if (window.gtag) { try { window.gtag('event', name, params || {}); } catch (e) { /* 무시 */ } }
  }

  var nowY = new Date().getFullYear();
  var calMode = 'solar';
  var current = null; /* { sy, sm, sd, name } */
  var fy = nowY;

  /* 셀렉트 채우기 */
  var selY = $('#tjp-year'), selM = $('#tjp-month'), selD = $('#tjp-day');
  var opts = '';
  for (var y = nowY; y >= 1930; y--) opts += '<option value="' + y + '">' + y + '년</option>';
  selY.innerHTML = opts;
  selY.value = '1995';
  opts = '';
  for (var m = 1; m <= 12; m++) opts += '<option value="' + m + '">' + m + '월</option>';
  selM.innerHTML = opts;
  opts = '';
  for (var d = 1; d <= 31; d++) opts += '<option value="' + d + '">' + d + '일</option>';
  selD.innerHTML = opts;

  /* 양력/음력 토글 */
  document.querySelectorAll('[data-cal]').forEach(function (b) {
    b.addEventListener('click', function () {
      calMode = b.getAttribute('data-cal');
      document.querySelectorAll('[data-cal]').forEach(function (x) { x.classList.toggle('active', x === b); });
      $('#tjp-leap-row').hidden = calMode !== 'lunar';
    });
  });

  /* 저장된 명식 (사주첩 본 앱과 같은 기기면 자동 인식) */
  function savedProfile() {
    try {
      var book = JSON.parse(localStorage.getItem('sajucheop.book.v1') || '[]');
      var self = (book || []).filter(function (b) { return b.self; })[0];
      if (self) return self;
      var p = JSON.parse(localStorage.getItem('sajucheop.profile.v1') || 'null');
      return p || null;
    } catch (e) { return null; }
  }
  var prof = savedProfile();
  if (prof && prof.year) {
    $('#tjp-resume-name').textContent = prof.name ? prof.name + ' 님' : '저장된 명식';
    $('#tjp-resume-birth').textContent = prof.year + '.' + prof.month + '.' + prof.day;
    $('#tjp-resume').hidden = false;
    $('#tjp-resume-go').addEventListener('click', function () {
      run({ sy: prof.year, sm: prof.month, sd: prof.day, name: prof.name || '' });
    });
  }

  function computeClicked() {
    var y = +selY.value, m = +selM.value, d = +selD.value;
    var name = $('#tjp-name').value.trim();
    var sy = y, sm = m, sd = d;
    if (calMode === 'lunar') {
      var cal = new window.KoreanLunarCalendar();
      if (!cal.setLunarDate(y, m, d, $('#tjp-leap').checked)) {
        toast('해당 음력 날짜가 존재하지 않아요. 날짜를 확인해 주세요.');
        return;
      }
      var s = cal.getSolarCalendar();
      sy = s.year; sm = s.month; sd = s.day;
    }
    run({ sy: sy, sm: sm, sd: sd, name: name });
  }
  $('#tjp-run').addEventListener('click', computeClicked);

  function run(birth) {
    current = birth;
    render();
    $('#tjp-result').hidden = false;
    $('#tjp-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
    track('tojeong_view', { y: fy, page: 'standalone' });
  }

  function yearGanjiKor(y) {
    return M.ganjiName(((y - 4) % 10 + 10) % 10, ((y - 4) % 12 + 12) % 12).kor;
  }

  function render() {
    if (!current) return;
    var seg = $('#tjp-year-seg');
    seg.innerHTML = [nowY, nowY + 1].map(function (y) {
      return '<button type="button" class="seg-btn' + (y === fy ? ' active' : '') + '" data-fy="' + y + '">' +
        y + '년 ' + yearGanjiKor(y) + '</button>';
    }).join('');
    seg.querySelectorAll('[data-fy]').forEach(function (b) {
      b.addEventListener('click', function () { fy = +b.getAttribute('data-fy'); render(); });
    });

    var r = TJ.compute(fy, current);
    if (!r) { toast('괘 계산에 문제가 생겼어요. 날짜를 확인해 주세요.'); return; }
    var tx = TJ.text(r.code);

    $('#tjp-code').textContent = (current.name ? current.name + ' 님 · ' : '') + fy + '년 제' + r.code + '괘';
    $('#tjp-han').textContent = tx.han;
    $('#tjp-gloss').textContent = '「' + tx.gloss + '」';
    $('#tjp-title').textContent = tx.title;
    $('#tjp-overview').textContent = tx.overview;
    $('#tjp-half').textContent = tx.half + ' 한 해의 맺음은 「' + tx.ending + '」의 상입니다.';
    $('#tjp-caution').textContent = tx.caution;

    var dayStem = M.dayPillarOf(current.sy, current.sm, current.sd).stem;
    $('#tjp-months').innerHTML = TJ.monthly(fy, dayStem).map(function (mo) {
      return '<div class="fortune-row"><span class="f-label" style="width: 66px;">음력 ' + mo.m + '월</span>' +
        '<span class="f-text"><b>' + mo.ganji.kor + '월 · ' + mo.sip + '</b> — ' + mo.line + '</span></div>';
    }).join('');

    $('#tjp-note').textContent = '음력 ' + r.lunarBirth.m + '월 ' + r.lunarBirth.d + '일생 · ' + fy + '년 세는나이 ' +
      r.age + '세 기준' + (r.lunarBirth.leap ? ' (윤달생은 본달로 계산)' : '') +
      '. 괘 산출은 전통 방식(태세·월건·일진수)을 따르고, 풀이 글은 사주첩이 오늘의 언어로 새로 쓴 것입니다.';
  }

  $('#tjp-share').addEventListener('click', function () {
    if (!current) return;
    track('tojeong_share');
    var r = TJ.compute(fy, current);
    var tx = TJ.text(r.code);
    var text = fy + '년 나의 토정비결 — 제' + r.code + '괘 「' + tx.gloss + '」 · 사주첩';
    var url = 'https://sajucheop.com/tojeong/';
    if (navigator.share) {
      navigator.share({ title: '사주첩 — 토정비결', text: text, url: url }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text + '\n' + url).then(function () { toast('토정비결을 복사했어요.'); });
    }
  });
})();
</script>
