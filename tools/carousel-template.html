<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #555; }
  #card {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #F6F1E8;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
    color: #211C15;
  }
  /* 한지 결 */
  #card::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 85% -10%, rgba(184, 56, 45, .05), transparent 60%),
      radial-gradient(ellipse 700px 500px at -10% 110%, rgba(33, 28, 21, .04), transparent 60%);
  }
  .frame {
    position: absolute;
    inset: 44px;
    border: 1.5px solid rgba(33, 28, 21, .28);
  }
  .frame::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(33, 28, 21, .12);
  }
  .inner {
    position: absolute;
    inset: 44px;
    padding: 84px 88px;
    display: flex;
    flex-direction: column;
  }
  .seal {
    width: 74px;
    height: 74px;
    border-radius: 14px;
    background: #B8382D;
    color: #F6F1E8;
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.15;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
  }
  .brand-line {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: auto;
  }
  .brand-line b { font-family: 'Noto Serif KR', serif; font-size: 34px; font-weight: 700; }
  .brand-line span { font-size: 26px; color: #6E6455; }

  /* 표지 */
  .overline {
    font-size: 30px;
    letter-spacing: 10px;
    color: #B8382D;
    font-weight: 700;
  }
  .cover-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 92px;
    line-height: 1.32;
    margin-top: 56px;
    letter-spacing: -1px;
  }
  .cover-sub {
    font-size: 36px;
    color: #6E6455;
    margin-top: 44px;
    line-height: 1.6;
  }
  .cover-hanja {
    position: absolute;
    right: 96px;
    bottom: 150px;
    font-family: 'Noto Serif KR', serif;
    font-size: 200px;
    color: rgba(184, 56, 45, .10);
    font-weight: 900;
  }
  .swipe {
    position: absolute;
    right: 88px;
    bottom: 92px;
    font-size: 26px;
    color: #9A8F7E;
  }

  /* 본문 카드 */
  .num {
    font-family: 'Noto Serif KR', serif;
    font-size: 60px;
    font-weight: 700;
    color: #B8382D;
  }
  .head {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 62px;
    line-height: 1.35;
    margin-top: 40px;
    letter-spacing: -0.5px;
  }
  .rule {
    width: 76px;
    height: 4px;
    background: #211C15;
    margin: 52px 0;
  }
  .body {
    font-size: 41px;
    line-height: 1.78;
    color: #40372B;
    word-break: keep-all;
  }

  /* CTA */
  .cta-inner { align-items: center; text-align: center; justify-content: center; gap: 0; }
  .cta-inner .seal { width: 110px; height: 110px; font-size: 38px; border-radius: 20px; }
  .cta-title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 72px;
    margin-top: 64px;
    line-height: 1.4;
  }
  .cta-domain {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 58px;
    color: #B8382D;
    margin-top: 48px;
  }
  .cta-feats {
    font-size: 32px;
    color: #6E6455;
    margin-top: 40px;
    line-height: 1.7;
  }
  .cta-handle { font-size: 30px; color: #9A8F7E; margin-top: 72px; }
</style>
</head>
<body>
<div id="card"></div>
<script>
  var HANJA_NUM = ['一', '二', '三', '四', '五', '六', '七', '八'];

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function br(s) { return esc(s).replace(/\n/g, '<br>'); }

  window.renderCard = function (d) {
    var card = document.getElementById('card');
    var html = '<div class="frame"></div>';
    if (d.type === 'cover') {
      html += '<div class="inner">' +
        '<div class="overline">사주첩 서재</div>' +
        '<h1 class="cover-title">' + br(d.title) + '</h1>' +
        '<p class="cover-sub">' + br(d.sub || '') + '</p>' +
        '<div class="cover-hanja">' + esc(d.hanja || '命') + '</div>' +
        '<div class="brand-line"><div class="seal">四<br>柱</div><b>사주첩</b><span>@sajucheop</span></div>' +
        '<div class="swipe">옆으로 넘기기 →</div>' +
        '</div>';
    } else if (d.type === 'cta') {
      html += '<div class="inner cta-inner">' +
        '<div class="seal">四<br>柱</div>' +
        '<div class="cta-title">읽는 운세가 아니라<br>매일 쓰는 도구</div>' +
        '<div class="cta-domain">sajucheop.com</div>' +
        '<div class="cta-feats">오늘의 운세 · 나만의 길일 캘린더 · 링크 궁합<br>토정비결 · 아기 이름 짓기 — 전부 무료</div>' +
        '<div class="cta-handle">프로필 링크에서 10초 · @sajucheop</div>' +
        '</div>';
    } else {
      html += '<div class="inner">' +
        '<div class="num">' + HANJA_NUM[d.idx] + '</div>' +
        '<h2 class="head">' + br(d.head) + '</h2>' +
        '<div class="rule"></div>' +
        '<p class="body">' + br(d.body) + '</p>' +
        '<div class="brand-line"><div class="seal">四<br>柱</div><b>사주첩</b><span>sajucheop.com</span></div>' +
        '</div>';
    }
    card.innerHTML = html;
  };

  window.fontsReady = document.fonts
    ? document.fonts.load('900 92px "Noto Serif KR"')
        .then(function () { return document.fonts.load('700 62px "Noto Serif KR"'); })
        .then(function () { return document.fonts.load('400 41px "Noto Sans KR"'); })
        .then(function () { return document.fonts.ready; })
        .then(function () { return true; })
    : Promise.resolve(true);
</script>
</body>
</html>
